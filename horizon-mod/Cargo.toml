[package]
name = "skinsrestorer"
version = "1.0.1"
edition = "2024"
license = "GPL-3.0-only"

[lib]
path = "src/lib.rs"

[dependencies]
# The launcher fetches the pinned SDK into .horizon/sdk/ before building.
horizon-mod-api = { path = ".horizon/sdk/api/crates/horizon-mod-api" }
log = "=0.4.34"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
