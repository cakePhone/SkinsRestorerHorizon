[package]
name = "skinsrestorer"
version = "1.0.0"
edition = "2024"

[lib]
path = "src/lib.rs"

[dependencies]
# The launcher fetches the pinned SDK into .horizon/sdk/ before building.
horizon-mod-api = { path = ".horizon/sdk/api/crates/horizon-mod-api" }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
# Mojang's profile and session APIs are HTTPS; the lookup runs on a worker thread.
ureq = { version = "2", default-features = false, features = ["tls"] }
